<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- E -->
  <text x="135" y="280" font-family="Arial, Helvetica, sans-serif" font-size="200" font-weight="bold" fill="white" text-anchor="middle">E</text>
  <!-- 360 -->
  <text x="340" y="360" font-family="Arial, Helvetica, sans-serif" font-size="100" font-weight="bold" fill="white" opacity="0.9" text-anchor="middle">360</text>
  <!-- Accent line -->
  <rect x="80" y="390" width="352" height="6" rx="3" fill="white" opacity="0.5"/>
</svg>
